<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Drift Launcher</title>
  <style>
    :root {
      --bg1: #071028;
      --bg2: #0b1f4d;
      --card: rgba(255, 255, 255, 0.08);
      --text: #f4f7ff;
      --muted: #c6d4ff;
      --accent: #32d0ff;
      --accent2: #6df7c1;
      --border: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(50, 208, 255, 0.18), transparent 60%),
        radial-gradient(1000px 700px at 90% 90%, rgba(109, 247, 193, 0.15), transparent 60%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      padding: 24px;
    }

    .panel {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 5vw, 36px);
      line-height: 1.1;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .row {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    select,
    button {
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 16px;
    }

    select {
      width: 100%;
      padding: 0 14px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.3);
      outline: none;
    }

    button {
      padding: 0 18px;
      cursor: pointer;
      color: #012133;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 0;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px) scale(0.99); }

    .links {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
    }

    .links a:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Space Drift</h1>
    <p>Chọn phiên bản bạn muốn chạy.</p>

    <div class="row">
      <select id="version-select" aria-label="Chọn phiên bản"></select>
      <button id="start-btn" type="button">Chạy</button>
    </div>

    <div class="links" id="quick-links"></div>
    <div class="status" id="status"></div>
  </main>

  <script>
    const select = document.getElementById('version-select');
    const startBtn = document.getElementById('start-btn');
    const quickLinks = document.getElementById('quick-links');
    const statusEl = document.getElementById('status');

    const fileRegex = /^space-drift-v([0-9]+(?:\.[0-9]+)*)\.html$/i;
    const fallbackFiles = [
      'space-drift-v2.1.html',
      'space-drift-v2.0.html',
      'space-drift-v1.0.html'
    ];

    function parseVersion(filename) {
      const m = filename.match(fileRegex);
      return m ? m[1] : null;
    }

    function compareVersionDesc(a, b) {
      const va = parseVersion(a).split('.').map(Number);
      const vb = parseVersion(b).split('.').map(Number);
      const len = Math.max(va.length, vb.length);
      for (let i = 0; i < len; i++) {
        const na = va[i] || 0;
        const nb = vb[i] || 0;
        if (na !== nb) return nb - na;
      }
      return 0;
    }

    async function scanVersionFiles() {
      const res = await fetch('./', { cache: 'no-store' });
      if (!res.ok) throw new Error('Cannot list directory');
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const hrefs = [...doc.querySelectorAll('a[href]')].map(a => a.getAttribute('href'));

      const files = hrefs
        .map(href => {
          try {
            return decodeURIComponent(href.split('?')[0].split('#')[0]);
          } catch {
            return href;
          }
        })
        .filter(href => !href.includes('/'))
        .filter(href => fileRegex.test(href));

      return [...new Set(files)].sort(compareVersionDesc);
    }

    function renderFiles(files, sourceLabel) {
      select.innerHTML = '';
      quickLinks.innerHTML = '';

      files.forEach((file) => {
        const version = parseVersion(file);

        const option = document.createElement('option');
        option.value = file;
        option.textContent = `v${version}`;
        select.appendChild(option);

        const link = document.createElement('a');
        link.href = file;
        link.textContent = `Mo nhanh v${version}`;
        quickLinks.appendChild(link);
      });

      statusEl.textContent = `${sourceLabel}: tim thay ${files.length} version.`;
      startBtn.disabled = files.length === 0;
    }

    async function init() {
      try {
        const files = await scanVersionFiles();
        if (!files.length) throw new Error('No matching files found');
        renderFiles(files, 'Tu dong quet');
      } catch {
        const files = fallbackFiles.filter(f => fileRegex.test(f)).sort(compareVersionDesc);
        renderFiles(files, 'Fallback danh sach co san');
      }
    }

    function launchSelectedVersion() {
      const file = select.value;
      if (!file) return;
      window.location.href = file;
    }

    startBtn.addEventListener('click', launchSelectedVersion);
    select.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') launchSelectedVersion();
    });

    init();
  </script>
</body>
</html>
