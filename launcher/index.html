<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Space Drift Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #050814;
      --bg-mid: #0a1230;
      --bg-bottom: #170a2c;
      --text: #f8fbff;
      --muted: #b8c8ff;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #35d6ff;
      --accent-2: #ffd657;
      --good: #6ef7b1;
      --danger: #ff5f78;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 680px at 8% 10%, rgba(53, 214, 255, 0.24), transparent 58%),
        radial-gradient(1000px 600px at 96% 84%, rgba(255, 214, 87, 0.2), transparent 60%),
        linear-gradient(165deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
      overflow-x: hidden;
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .stars,
    .stars::before,
    .stars::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.55), transparent 70%),
        radial-gradient(1px 1px at 70% 22%, rgba(255,255,255,0.45), transparent 70%),
        radial-gradient(2px 2px at 80% 70%, rgba(255,255,255,0.35), transparent 70%),
        radial-gradient(1px 1px at 40% 86%, rgba(255,255,255,0.35), transparent 70%);
      animation: drift 16s linear infinite;
      opacity: 0.8;
    }

    .stars::before { animation-duration: 22s; opacity: 0.5; }
    .stars::after { animation-duration: 28s; opacity: 0.35; }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-22px); }
    }

    .wrap {
      width: min(860px, 100%);
      position: relative;
      z-index: 2;
    }

    .hero {
      border: 1px solid var(--glass-border);
      background: linear-gradient(145deg, rgba(14, 26, 64, 0.86), rgba(15, 10, 36, 0.86));
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(9px);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.38);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 0.96;
      letter-spacing: 2px;
      margin: 0 0 8px;
      background: linear-gradient(120deg, #8de4ff, #ffd657, #ff86be);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      letter-spacing: 1.2px;
      font-size: clamp(13px, 2.4vw, 16px);
    }

    .controls {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto;
    }

    select, button {
      height: 50px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      font-family: inherit;
      font-size: 15px;
    }

    select {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 0 14px;
      outline: none;
    }

    button {
      border: 0;
      padding: 0 22px;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #00132a;
      background: linear-gradient(130deg, var(--accent), var(--good));
      box-shadow: 0 10px 30px rgba(53, 214, 255, 0.25);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(0.98); }

    .cards-wrap {
      margin-top: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.16);
      padding: 10px;
      max-height: 290px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 62px;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.33);
    }

    .v {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 16px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 800;
      color: #231500;
      background: linear-gradient(120deg, var(--accent-2), #ff9f5a);
      border-radius: 999px;
      padding: 5px 9px;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      min-height: 1.2em;
    }

    .err { color: #ff9aac; }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
      .cards-wrap { max-height: 250px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="wrap">
    <section class="hero">
      <h1 class="title">SPACE DRIFT</h1>
      <p class="sub">Choose a version and launch instantly. Recommended: v3.0.</p>

      <div class="controls">
        <select id="version-select" aria-label="Choose version"></select>
        <button id="start-btn" type="button">LAUNCH</button>
      </div>

      <div class="cards-wrap">
        <div class="cards" id="quick-links"></div>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const select = document.getElementById('version-select');
    const startBtn = document.getElementById('start-btn');
    const quickLinks = document.getElementById('quick-links');
    const statusEl = document.getElementById('status');

    const fileRegex = /^space-drift-v([0-9]+(?:\.[0-9]+)*)\.html$/i;
    const preferred = 'space-drift-v3.0.html';
    const fallbackFiles = [
      'space-drift-v3.0.html',
      'space-drift-v2.2.html',
      'space-drift-v2.1.html',
      'space-drift-v2.0.html',
      'space-drift-v1.0.html'
    ];

    function parseVersion(filename) {
      const m = filename.match(fileRegex);
      return m ? m[1] : null;
    }

    function compareVersionDesc(a, b) {
      const va = parseVersion(a).split('.').map(Number);
      const vb = parseVersion(b).split('.').map(Number);
      const len = Math.max(va.length, vb.length);
      for (let i = 0; i < len; i++) {
        const na = va[i] || 0;
        const nb = vb[i] || 0;
        if (na !== nb) return nb - na;
      }
      return 0;
    }

    async function scanVersionFiles() {
      const res = await fetch('./', { cache: 'no-store' });
      if (!res.ok) throw new Error('Cannot list directory');
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const hrefs = [...doc.querySelectorAll('a[href]')].map(a => a.getAttribute('href'));

      const files = hrefs
        .map(href => {
          try {
            return decodeURIComponent(href.split('?')[0].split('#')[0]);
          } catch {
            return href;
          }
        })
        .filter(href => !href.includes('/'))
        .filter(href => fileRegex.test(href));

      return [...new Set(files)].sort(compareVersionDesc);
    }

    function renderFiles(files, sourceLabel) {
      select.innerHTML = '';
      quickLinks.innerHTML = '';

      const sorted = [...files].sort(compareVersionDesc);

      sorted.forEach((file) => {
        const version = parseVersion(file);
        const isPreferred = file.toLowerCase() === preferred;

        const option = document.createElement('option');
        option.value = file;
        option.textContent = isPreferred ? `v${version} (Recommended)` : `v${version}`;
        select.appendChild(option);

        const link = document.createElement('a');
        link.href = file;
        link.className = 'card';
        link.innerHTML = `
          <div>
            <div class="v">v${version}</div>
            <div class="meta">${file}</div>
          </div>
          ${isPreferred ? '<span class="badge">Recommended</span>' : '<span class="meta">Play</span>'}
        `;
        quickLinks.appendChild(link);
      });

      const preferredOption = [...select.options].find(o => o.value.toLowerCase() === preferred);
      if (preferredOption) {
        select.value = preferred;
      }

      statusEl.textContent = `${sourceLabel}: found ${sorted.length} versions.`;
      startBtn.disabled = sorted.length === 0;
    }

    async function init() {
      try {
        const files = await scanVersionFiles();
        if (!files.length) throw new Error('No matching files found');
        renderFiles(files, 'Auto scan');
      } catch {
        const files = fallbackFiles.filter(f => fileRegex.test(f)).sort(compareVersionDesc);
        renderFiles(files, 'Fallback list');
        statusEl.classList.add('err');
        statusEl.textContent += ' (directory listing unavailable)';
      }
    }

    function launchSelectedVersion() {
      const file = select.value;
      if (!file) return;
      window.location.href = file;
    }

    startBtn.addEventListener('click', launchSelectedVersion);
    select.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') launchSelectedVersion();
    });

    init();
  </script>
</body>
</html>
