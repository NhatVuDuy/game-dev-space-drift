name: Deploy Space Drift to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v4/package-lock.json

      - name: Install v4 dependencies
        working-directory: v4
        run: npm ci

      - name: Build v4
        working-directory: v4
        run: npm run build

      - name: Assemble deployment directory
        run: |
          mkdir -p _site/v4
          cp index.html _site/
          cp CNAME _site/ 2>/dev/null || true
          cp -r launcher _site/ 2>/dev/null || true
          cp space-drift-v*.html _site/ 2>/dev/null || true
          cp GAME_DESIGN.md _site/ 2>/dev/null || true
          cp space-drift-engine-doc.md _site/ 2>/dev/null || true
          cp -r v4/dist/. _site/v4/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
